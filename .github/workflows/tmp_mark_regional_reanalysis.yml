name: Temporary Mark regional reanalysis
on:
  push:
    branches: [tmp-mark-regional-reanalysis-20260712]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and source texts
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy lxml
          npm install sblgnt@1.0.0
          mkdir -p lxx_wheel lxx_data
          python -m pip download --no-deps uniquebible==0.2.9 -d lxx_wheel
          python - <<'PY'
          import glob,zipfile
          wheel=glob.glob('lxx_wheel/*.whl')[0]
          member='uniquebible/marvelData/bibles/LXX.bible'
          with zipfile.ZipFile(wheel) as z:
              z.extract(member,'lxx_data')
          print('extracted',member)
          PY
      - name: Fetch comparison corpus
        run: git clone --depth 1 https://github.com/OpenGreekAndLatin/First1KGreek.git first1k
      - name: Run analysis
        shell: bash
        run: |
          mkdir -p regional_results
          set +e
          python tmp_mark_regional/phase2_analysis.py \
            --first1k first1k \
            --sblgnt node_modules/sblgnt \
            --lxx-db lxx_data/uniquebible/marvelData/bibles/LXX.bible \
            --out regional_results \
            --bootstraps 3000 > regional_results/analysis.log 2>&1
          status=$?
          set -e
          cp tmp_mark_regional/phase2_analysis.py regional_results/
          printf '%s\n' 'First1KGreek commit:' "$(git -C first1k rev-parse HEAD)" > regional_results/runtime_manifest.txt
          python --version >> regional_results/runtime_manifest.txt
          python -m pip freeze >> regional_results/runtime_manifest.txt
          printf 'exit_status=%s\n' "$status" >> regional_results/runtime_manifest.txt
          zip -r mark_regional_phase2_results.zip regional_results
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mark-regional-phase2-results
          path: mark_regional_phase2_results.zip
          retention-days: 7
