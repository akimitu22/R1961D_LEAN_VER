name: Temporary Mark OT quotation diagnostic
on:
  push:
    branches: [tmp-mark-regional-reanalysis-20260712]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source texts
        run: |
          npm install sblgnt@1.0.0
          mkdir -p lxx_wheel lxx_data
          python -m pip download --no-deps uniquebible==0.2.9 -d lxx_wheel
          python - <<'PY'
          import glob,zipfile
          wheel=glob.glob('lxx_wheel/*.whl')[0]
          member='uniquebible/marvelData/bibles/LXX.bible'
          with zipfile.ZipFile(wheel) as z:
              z.extract(member,'lxx_data')
          PY
      - name: Extract quotation verses and database schema
        run: |
          python tmp_mark_regional/quote_diagnostic.py \
            --sblgnt node_modules/sblgnt \
            --lxx-db lxx_data/uniquebible/marvelData/bibles/LXX.bible \
            --out quote_diagnostic
          zip -r mark_ot_quote_diagnostic.zip quote_diagnostic
      - uses: actions/upload-artifact@v4
        with:
          name: mark-ot-quote-diagnostic
          path: mark_ot_quote_diagnostic.zip
          retention-days: 7
